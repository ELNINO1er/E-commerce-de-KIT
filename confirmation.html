<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paiement reçu — KIC</title><meta name="robots" content="noindex"><link rel="icon" href="img/Logo%20KIC%2001.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/kic.css"><link rel="stylesheet" href="css/commerce.css"></head><body><main class="kic-commerce"><div class="kic-commerce__inner"><section class="kic-checkout-form" style="max-width:760px;margin:8vh auto;text-align:center"><img src="img/Logo%20KIC%2001.png" alt="KIC" width="140" height="140" style="margin:0 auto 28px;border-radius:18px"><p class="kic-eyebrow">Paiement transmis</p><h1>Merci pour votre confiance</h1><p>Votre commande <strong id="order-number"></strong> a été enregistrée. Stripe confirme le paiement à KIC de manière sécurisée.</p><p class="kic-checkout-note">Vous recevrez ensuite les informations de préparation et de livraison.</p><a class="kic-btn kic-btn--gold" href="index.html">Retour à l’accueil</a> <a class="kic-btn kic-btn--dark" href="produits.html">Continuer mes achats</a></section></div></main><script>var order=JSON.parse(sessionStorage.getItem('kic.last.order')||'{}');document.getElementById('order-number').textContent=order.orderNumber||new URLSearchParams(location.search).get('order')||'';localStorage.removeItem('kic.cart.items');if(window.gtag)window.gtag('event','purchase',{transaction_id:order.orderNumber||'',value:Number(order.total||0)/100,currency:'EUR'});</script><script src="js/analytics-consent.js" defer></script></body></html>
